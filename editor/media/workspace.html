<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';">

<meta charset="utf-8">

<link rel="stylesheet" href="{{katexBase}}katex.min.css">
<script defer nonce="{{nonce}}" src="{{katexBase}}katex.min.js"></script>
<script defer nonce="{{nonce}}" src="{{katexBase}}contrib/auto-render.min.js"></script>
<style>
  :root{
    --canvas:#101216; --canvas-2:#0B0D10; --editor-bg:#0C0E12; --panel:#171A20; --panel-2:#1E222A; --panel-3:#252A33;
    --line:#282D37; --line-2:#353C48; --tick:#3B4350;
    --ink:#ECEEF1; --ink-dim:#B2B8C2; --ink-mut:#838B98; --ink-faint:#5A616E;
    --amber:#F4B94E; --amber-2:#FFD277; --amber-dim:#8C6B2E; --amber-glow:rgba(244,185,78,.16);
    --pass:#4BD6A0; --pass-2:#86ECC3; --pass-dim:#235444; --fail:#F2694F; --fail-dim:#5A2418; --steel:#86ABCC;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,"JetBrains Mono",monospace;
    --ease:cubic-bezier(.16,1,.3,1);
    --lw:300px; --rw:360px;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;height:100%;width:100%;}
  body{background:var(--canvas-2);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---- topbar ---- */
  .top{flex:0 0 auto;height:44px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);}
  /* The mark is the letters ML, set in the interface's own mono face inside a
     tile — real type, not hand-drawn letterforms. The tile carries the amber so
     the wordmark beside it can stay quiet. */
  .mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:22px;height:22px;border-radius:5px;background:var(--amber);
    font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:-.04em;
    color:#101216;line-height:1;user-select:none;}
  .wm{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;flex:0 0 auto;}
  .back{display:none;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--amber-2);cursor:pointer;padding:3px 8px;border-radius:6px;flex:0 0 auto;}
  .back:hover{background:var(--panel-2);}
  .crumb{font-family:var(--mono);font-size:11.5px;color:var(--ink-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .crumb b{color:var(--ink-dim);}
  .top .spc{flex:1;}
  .prog{font-family:var(--mono);font-size:11px;color:var(--ink-mut);flex:0 0 auto;} .prog b{color:var(--amber);}
  .lang{flex:0 0 auto;display:flex;align-items:center;gap:6px;}
  .lang svg{width:14px;height:14px;fill:none;stroke:var(--ink-mut);stroke-width:1.5;}
  select{font-family:var(--mono);font-size:11px;color:var(--ink-dim);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;cursor:pointer;outline:none;}
  .grade{display:none;align-items:center;gap:9px;cursor:pointer;font-weight:600;font-size:12.5px;color:#17130a;flex:0 0 auto;
    border:1px solid #b8862f;border-radius:8px;padding:7px 15px;background:linear-gradient(180deg,var(--amber-2),var(--amber));box-shadow:0 1px 0 rgba(255,255,255,.25) inset;}
  .grade:hover{filter:brightness(1.05);} .grade[disabled]{opacity:.5;pointer-events:none;}
  .grade kbd{font-family:var(--mono);font-size:10px;color:#4b3a12;background:rgba(255,255,255,.28);border:1px solid rgba(0,0,0,.15);border-radius:4px;padding:1px 5px;}
  .grade .spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(23,19,10,.35);border-top-color:#17130a;animation:spin .7s linear infinite;display:none;}
  .grade.running .spin{display:inline-block;} .grade.running .gl{display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .app.is-work .back{display:flex;} .app.is-work .grade{display:flex;} .app.is-work .roadmapTitle{display:none;}
  .app.is-home .crumb{display:none;}

  /* ================= HOME / ROADMAP ================= */
  .home{flex:1 1 auto;min-height:0;overflow-y:auto;display:none;}
  .app.is-home .home{display:block;}
  .home-in{max-width:1100px;margin:0 auto;padding:26px 30px 60px;}
  .home-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;}
  .home-head h1{font-size:22px;font-weight:600;margin:0;} .home-head .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-mut);margin-top:5px;} .home-head .sub b{color:var(--amber);}
  .home-head .legend{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--ink-mut);}
  .legend i{display:inline-flex;align-items:center;gap:6px;} .legend .sw{width:9px;height:9px;border-radius:3px;}
  .sw.mast{background:var(--pass);} .sw.act{background:var(--amber);} .sw.lock{background:var(--line-2);}
  /* ---- roadmap ----
     Area -> track -> task, the shape this had before the honeycomb detour:
     an area is a collapsible section, a track is a card, a task is a chip.
     Text is horizontal everywhere, which is the whole reason to be here. */
  .tier{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--panel);}
  .tier-h{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;width:100%;
    background:none;border:0;color:inherit;font:inherit;text-align:left;}
  .tier-h:hover{background:var(--panel-2);}
  .tier-h:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}
  .tw{display:grid;place-items:center;flex:0 0 auto;transition:transform .18s var(--ease);transform:rotate(90deg);}
  .tier.collapsed .tw{transform:rotate(0deg);}
  .tw svg{width:13px;height:13px;fill:none;stroke:var(--ink-mut);stroke-width:1.9;}
  /* progress ring instead of the old roman numeral: it says something */
  .tring{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    background:conic-gradient(var(--pass) calc(var(--p,0)*1%),var(--panel-3) 0);}
  .tring::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--panel);}
  .tier.locked{opacity:.55;}
  .t-main{min-width:0;flex:1;}
  .tier-nm{font-size:14px;font-weight:650;letter-spacing:-.01em;display:block;}
  .tier-tag{font-size:11.5px;color:var(--ink-mut);margin-top:3px;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .t-meta{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .lg{font-family:var(--mono);font-size:9.5px;padding:2px 5px;border-radius:4px;
    border:1px solid var(--line-2);color:var(--ink-mut);}
  .lg.cpp{border-color:#4A3A63;color:var(--violet);} .lg.cuda{border-color:#2C5A66;color:var(--cyan);}
  .tier-f{font-family:var(--mono);font-size:11px;color:var(--ink-dim);}
  .info{width:21px;height:21px;border-radius:50%;border:1px solid var(--line-2);background:none;
    color:var(--ink-mut);font:600 10px var(--sans);cursor:pointer;display:grid;place-items:center;padding:0;}
  .info:hover{border-color:var(--amber-dim);color:var(--amber-2);}
  .tier.about-on .info{border-color:var(--amber-dim);color:var(--amber-2);background:var(--amber-glow);}
  .info:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* "what is this block" — prose, opened from the ? button */
  .about{display:none;padding:2px 18px 16px 53px;max-width:76ch;}
  .tier.about-on .about{display:block;}
  .about p{margin:0;font-size:12.5px;line-height:1.65;color:var(--ink-dim);text-wrap:pretty;}
  .about .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut);margin:14px 0 6px;}
  .about ul{margin:0;padding-left:16px;} .about li{font-size:12.5px;line-height:1.6;color:var(--ink-dim);margin:4px 0;}
  .about .how{font-family:var(--mono);font-size:10.5px;color:var(--ink-mut);line-height:1.55;
    margin-top:14px;padding-top:10px;border-top:1px solid var(--line);}

  .tier-b{padding:4px 16px 16px;} .tier.collapsed .tier-b{display:none;}
  .nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px;}
  .node{border:1px solid var(--line);border-radius:10px;background:var(--canvas);padding:12px 13px;
    display:flex;flex-direction:column;gap:9px;}
  .node.active{border-color:var(--amber-dim);} .node.locked{opacity:.55;}
  .node .n-top{display:flex;align-items:baseline;gap:8px;}
  .node .n-nm{font-size:12.5px;font-weight:600;color:var(--ink-dim);line-height:1.35;}
  .node.active .n-nm{color:var(--ink);}
  .node .n-fr{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-mut);flex:0 0 auto;}
  .bar{position:relative;height:3px;border-radius:2px;background:var(--panel-3);overflow:hidden;}
  .bar .f{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:2px;}
  .node.done .bar .f{background:var(--pass);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line-2);background:var(--panel);color:var(--ink-dim);
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s var(--ease),color .15s var(--ease);}
  .chip:hover{border-color:var(--amber-dim);color:var(--amber-2);}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:1px;}
  .chip.solved{border-color:var(--pass-dim);color:var(--pass-2);}
  .chip .d{color:var(--ink-faint);} .chip .lang{color:var(--steel);}
  .chip.cuda .lang{color:var(--cyan);} .chip.cpp .lang{color:var(--violet);}
  .node .plan{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);}
  @media (prefers-reduced-motion:reduce){.tw,.chip{transition:none;}}

  .bar{height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden;position:relative;background-image:repeating-linear-gradient(90deg,var(--tick) 0,var(--tick) 1px,transparent 1px,transparent 7px);}
  .bar .f{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:3px;} .node.done .bar .f{background:var(--pass);}

  /* ================= WORK (3 resizable cols) ================= */
  .work{flex:1 1 auto;min-height:0;display:none;grid-template-columns:var(--lw) 6px minmax(0,1fr) 6px var(--rw);}
  .app.is-work .work{display:grid;}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .left{border-right:1px solid var(--line);background:var(--canvas);}
  .center{background:var(--editor-bg);}
  .right{border-left:1px solid var(--line);background:var(--panel);}
  .rz{background:var(--line);cursor:col-resize;position:relative;} .rz:hover,.rz.drag{background:var(--amber-dim);}
  .rz::after{content:"";position:absolute;inset:0 -3px;}
  .col-h{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mut);}
  .col-h .gd{width:4px;height:4px;background:var(--amber);border-radius:50%;} .col-h .sp{flex:1;} .col-h .st{font-family:var(--mono);font-size:10px;text-transform:none;color:var(--ink-faint);}
  .scroll{flex:1 1 auto;overflow:auto;}

  /* left = brief only */
  .brief{padding:16px;}
  .b-id{font-family:var(--mono);font-size:11px;color:var(--amber);} .b-title{font-size:16px;font-weight:600;margin:6px 0 10px;line-height:1.3;}
  .b-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
  .b-tag{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);}
  .md{font-size:12.5px;line-height:1.62;color:var(--ink-dim);}
  .md h1,.md h2,.md h3{color:var(--ink);font-weight:600;margin:15px 0 7px;} .md h1{font-size:14px;} .md h2{font-size:13px;} .md h3{font-size:12px;}
  .md p{margin:8px 0;} .md strong{color:var(--ink);}
  .md code{font-family:var(--mono);font-size:12px;background:var(--panel-2);border-radius:4px;padding:1px 5px;color:var(--ink);}
  .md pre{background:var(--canvas-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:9px 0;} .md pre code{background:none;border:0;padding:0;color:var(--ink-dim);}
  .md ul,.md ol{margin:9px 0;padding-left:22px;} .md li{margin:4px 0;line-height:1.6;}
  /* A list item that is nothing but code is a line of code, not a phrase with a
     grey highlight behind it: give it a block of its own so it never wraps into
     an irregular blob. */
  .md li > code.block, .md p > code.block{display:block;margin:3px 0 2px;padding:7px 9px;
    background:var(--canvas-2);border:1px solid var(--line);border-radius:6px;
    color:var(--ink-dim);white-space:pre-wrap;line-height:1.5;}
  /* when an inline span does wrap, each line keeps its own padding and corners */
  .md code{-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .md ol{list-style:decimal;} .md ol li::marker{color:var(--ink-mut);font-family:var(--mono);font-size:11px;}
  .md hr{border:0;border-top:1px solid var(--line);margin:16px 0;}
  /* a long identifier in a narrow column must break rather than overflow */
  .md code{overflow-wrap:anywhere;}
  .md blockquote{border-left:2px solid var(--amber-dim);margin:9px 0;padding:2px 0 2px 12px;color:var(--ink-mut);}
  .md table{border-collapse:collapse;width:100%;margin:11px 0;font-size:12px;} .md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;} .md th{background:var(--panel-2);color:var(--ink);font-weight:600;font-size:11.5px;}

  /* center = editor */
  .tabbar{flex:0 0 auto;height:32px;display:flex;align-items:center;background:var(--canvas-2);border-bottom:1px solid var(--line);}
  .ftab{display:flex;align-items:center;gap:8px;padding:0 14px;height:32px;font-size:12px;border-right:1px solid var(--line);background:var(--editor-bg);position:relative;}
  .ftab::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--amber);} .ftab .ic{font-family:var(--mono);font-size:10px;color:var(--steel);}
  .ed{position:relative;flex:1 1 auto;min-height:0;display:flex;background:var(--editor-bg);font-family:var(--mono);font-size:13px;line-height:20px;overflow:hidden;}
  .gutter{flex:0 0 52px;padding:12px 10px 12px 0;text-align:right;color:var(--ink-faint);user-select:none;overflow:hidden;background:var(--editor-bg);}
  .gutter .ln{display:block;height:20px;} .gutter .ln.cur{color:var(--amber);}
  .cwrap{position:relative;flex:1 1 auto;overflow:auto;} .cinner{position:relative;min-width:100%;width:max-content;min-height:100%;}
  .hl,.ta{margin:0;padding:12px 20px 40px 12px;font:inherit;letter-spacing:0;tab-size:4;white-space:pre;word-wrap:normal;}
  .hl{position:relative;color:var(--ink-dim);pointer-events:none;min-width:100%;}
  .ta{position:absolute;inset:0;width:100%;height:100%;color:transparent;background:transparent;caret-color:var(--amber);border:0;outline:none;resize:none;overflow:hidden;-webkit-text-fill-color:transparent;}
  .ta::selection{background:rgba(244,185,78,.22);}
  .aline{position:absolute;left:0;right:0;height:20px;top:12px;background:rgba(255,255,255,.028);pointer-events:none;}
  .aline::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amber);opacity:.5;}
  .tk-kw{color:#E0836B;} .tk-def{color:var(--amber-2);} .tk-fn{color:#9DC7E8;} .tk-str{color:#7FD8A6;} .tk-num{color:#E8C583;} .tk-com{color:#5A616E;font-style:italic;} .tk-dec{color:#C89BE0;} .tk-op{color:var(--ink-mut);} .tk-todo{color:var(--fail);}

  /* right = instrument */
  .verdict{position:relative;margin:14px 14px 0;padding:17px 16px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-2);overflow:hidden;}
  .reticle{position:absolute;width:12px;height:12px;pointer-events:none;opacity:.85;}
  .reticle::before,.reticle::after{content:"";position:absolute;background:var(--amber);} .reticle::before{width:12px;height:1.5px;} .reticle::after{width:1.5px;height:12px;}
  .reticle.tl{top:8px;left:8px;} .reticle.tr{top:8px;right:8px;} .reticle.tr::before,.reticle.tr::after{right:0;} .reticle.bl{bottom:8px;left:8px;} .reticle.bl::before,.reticle.bl::after{bottom:0;} .reticle.br{bottom:8px;right:8px;} .reticle.br::before,.reticle.br::after{right:0;bottom:0;}
  .sweep{position:absolute;top:0;bottom:0;width:2px;left:-2px;background:linear-gradient(var(--amber),transparent);box-shadow:0 0 14px 2px var(--amber-glow);opacity:0;}
  .verdict.measuring .sweep{animation:sweep 1.1s var(--ease) infinite;opacity:1;} @keyframes sweep{0%{left:-2px;}100%{left:100%;}}
  .vst{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:12px;justify-content:center;color:var(--ink-mut);}
  .vst .bdg{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;border:1.5px solid currentColor;font-size:13px;}
  .verdict.pass .vst{color:var(--pass);} .verdict.fail .vst{color:var(--fail);} .verdict.measuring .vst{color:var(--amber);} .verdict.error .vst{color:var(--fail);}
  .vsub{text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-mut);margin-top:8px;} .vsub .ok{color:var(--pass);}
  .metrics{padding:12px 14px 6px;display:flex;flex-direction:column;gap:9px;}
  .metric{border:1px solid var(--line);border-radius:10px;background:var(--canvas);padding:10px 12px;}
  .metric.green{border-color:var(--pass-dim);} .metric.red{border-color:var(--fail-dim);}
  .m-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;} .m-name{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);display:flex;align-items:center;gap:7px;}
  .m-name .kind{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:4px;padding:1px 4px;}
  .m-v{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);} .metric.green .m-v{color:var(--pass);} .metric.red .m-v{color:var(--fail);}
  .m-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;color:var(--ink);margin:6px 0 3px;} .metric.green .m-val{color:var(--pass-2);}
  .m-gate{font-family:var(--mono);font-size:10px;color:var(--ink-mut);} .m-gate .thr{color:var(--ink-dim);}
  .console{border-top:1px solid var(--line);margin-top:8px;} .console .ch{padding:7px 14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mut);border-bottom:1px solid var(--line-2);}
  .console .cb{padding:8px 14px 14px;font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--ink-dim);white-space:pre-wrap;word-break:break-word;min-height:50px;}
  .console .ok{color:var(--pass);} .console .bad{color:var(--fail);}

  @media (max-width:960px){ .work{grid-template-columns:var(--lw) 6px 1fr;} .right,.work .rz+.rz{display:none;} }
</style>
</head>
<body>
  <div class="app is-home" id="app">
    <div class="top">
      <span class="mark" aria-hidden="true">ML</span>
      <span class="wm">mlsys-lab</span>
      <span class="back" id="back">‹ <span data-t="roadmap">Roadmap</span></span>
      <span class="crumb" id="crumb"></span>
      <span class="spc"></span>
      <span class="prog" id="prog"></span>
      <span class="lang"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
        </span>
      <div class="grade" id="gradeBtn" disabled><span class="spin"></span><span class="gl">▷</span> <span data-t="grade">Grade</span> <kbd>⌘↵</kbd></div>
    </div>

    <!-- HOME / ROADMAP -->
    <div class="home" id="home">
      <div class="home-in">
        <div class="home-head">
          <div><h1 class="roadmapTitle" data-t="roadmap">Roadmap</h1><div class="sub" id="hsub"></div></div>
          <div class="legend">
            <i><span class="sw mast"></span><span data-t="solved">solved</span></i>
            <i><span class="sw act"></span><span data-t="available">available</span></i>
            <i><span class="sw lock"></span><span data-t="planned">planned</span></i>
          </div>
        </div>
        <div id="map"></div>
      </div>
    </div>

    <!-- WORK -->
    <div class="work" id="work">
      <div class="col left"><div class="col-h"><span class="gd"></span><span data-t="task">Task</span></div><div class="scroll"><div class="brief" id="brief"></div></div></div>

        <div class="tabbar"><div class="ftab"><span class="ic" id="ficon">py</span><span id="fname">solve.py</span></div></div>
        <div class="ed">
          <div class="gutter" id="gutter"></div>
          <div class="cwrap" id="cwrap"><div class="cinner"><div class="aline" id="aline"></div><pre class="hl" id="hl" aria-hidden="true"></pre><textarea class="ta" id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea></div></div>
        </div>

          <div class="verdict" id="verdict"><span class="reticle tl"></span><span class="reticle tr"></span><span class="reticle bl"></span><span class="reticle br"></span><span class="sweep"></span>

  </div>

<script nonce="{{nonce}}">
  const vscode=acquireVsCodeApi();
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let mapData=null,curId=null,busy=false;
  /* Areas start folded. Fourteen areas expanded at once is several screens of
     scrolling before the first heading, and the roadmap's job is to let you see the
     shape of the bank and pick — not to render 2000 chips nobody asked for. The
     learner's own folding survives a reload through the webview's own state. */
  const saved=(vscode.getState&&vscode.getState())||{};
  const collapsed=new Set(saved.collapsed||[]);
  const aboutOpen=new Set();   // areas whose description is open
  let foldedOnce=!!saved.foldedOnce;
  function persistFolds(){
    try{vscode.setState({...(vscode.getState&&vscode.getState()||{}),
                         collapsed:[...collapsed],foldedOnce:true});}catch(_){}
  }

  /* ---------- i18n ---------- */
  /* The interface is English only. Statements are authored in English, which is
     also the working language of everything the learner will meet next — compiler
     errors, CUDA docs, papers — so nothing here is translated. */
  const TXT={roadmap:'Roadmap',grade:'Grade',solved:'solved',available:'available',
    planned:'planned',task:'Task',instrument:'Instrument',output:'output',
    awaiting:'AWAITING',measuring:'MEASURING…',
    vsub:'deterministic · same-machine · local',running:'running locally',
    consIdle:'— press Grade (⌘↵)',pass:'PASS',fail:'FAIL',error:'ERROR',
    gatesGreen:'gates green',begin:'Choose a task on the roadmap →'};
  function t(k){return TXT[k]||k;}
  function initLang(){
    document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.getAttribute('data-t'));});
  }

  /* ---------- roadmap ---------- */
  const CHEV='<svg viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg>';

  /* What each block of the course actually is. Without this the roadmap is a
     list of folder names — the learner cannot tell why a block exists or what
     they will be able to do after it. Keyed by the area slug the backend sends. */
  const AREA_INFO={
    'python-core':{
      tag:'The interpreter as a machine you can measure.',
      body:'CPython is not magic: objects have layouts, attribute lookup follows a fixed protocol, and every abstraction has a cost you can count. This block replaces folklore ("comprehensions are faster") with measurements.',
      you:['read the data model — descriptors, MRO, slots, the GIL','predict allocation and copy counts before running anything','tell a real optimisation from a superstition'],
      how:'graded in python: metrics come from a deterministic probe, never from wall-clock time'},
    'cpp-core':{
      tag:'Real C++, compiled by the real clang++.',
      body:'You write solve.cpp against a header contract; the grader compiles it with clang++ -O2 -std=c++20, runs it and diffs the numbers against a reference implementation. Ownership, lifetime and ABI stop being trivia and become things that either compile or crash.',
      you:['write move/copy semantics that do not double-free','reason about layout, alignment, vtables and name mangling','fix undefined behaviour you can actually observe'],
      how:'graded in C++: clang++ compile + run, output diffed against ref.cpp'},
    'cpu-perf':{
      tag:'Where the cycles actually go on a CPU.',
      body:'Caches, branch prediction, SIMD and memory layout decide throughput far more than instruction count does. Timings are not reproducible, so the gates count deterministic proxies — cache misses under a modelled hierarchy, lines touched, comparisons made.',
      you:['restructure loops and layouts for locality (AoS vs SoA, blocking)','predict miss counts before measuring them','recognise false sharing, aliasing and the cost of a branch'],
      how:'graded in C++ plus a deterministic cache model — same numbers on every machine'},
    'numeric-tensors':{
      tag:'Floating point, shapes and strides — from scratch.',
      body:'Every numerical bug downstream starts here: catastrophic cancellation, denormals, an accumulation order that changes the answer, a broadcast that silently allocates. You reimplement the primitives instead of trusting them.',
      you:['implement stable softmax, logsumexp, Welford, Kahan summation','read a tensor as (shape, strides, offset) and see the copies','bound and explain fp16/bf16/fp8 error instead of guessing'],
      how:'graded in python against a numpy oracle the grader computes itself'},
    'algorithms-scratch':{
      tag:'The ML building blocks, written by hand.',
      body:'kNN, k-means, PCA, gradient descent — small enough to write in an afternoon, deep enough that the numerical details decide whether they work. This is where the maths becomes code you own.',
      you:['derive and implement the core estimators without a library','choose distance metrics and initialisations on evidence','see why power iteration and SVD give the same subspace'],
      how:'graded in python: seeded data, reference computed in the grader'},
    'llm-internals':{
      tag:'A transformer, part by part.',
      body:'Attention, RoPE, GQA, normalisation, the KV cache, sampling — each rebuilt from the definition until the shapes and the masks stop being mysterious. This is the block that makes the systems work later make sense.',
      you:['implement attention with causal masks and cache reuse correctly','convert MHA to GQA/MQA and know what it costs','explain a decoding artefact by pointing at the tensor that caused it'],
      how:'graded in python against an oracle implementation of the same maths'},
    'gpu-cuda':{
      tag:'Real CUDA-C on a software GPU that measures like hardware.',
      body:'You write an actual .cu kernel — __global__, threadIdx, __shared__, __syncthreads, warp shuffles. It runs on a simulator that models 32-lane warps, 128-byte coalescing transactions, 32 shared-memory banks and warp divergence, so the lesson is a measured number, not a claim. No NVIDIA GPU required.',
      you:['write coalesced kernels and prove it by transaction count','kill shared-memory bank conflicts (and see the 16x)','use barriers and warp shuffles with correct semantics'],
      how:'graded in CUDA-C: your .cu is parsed and executed thread by thread; gates read transactions, bank waves, divergence'},
    'llm-systems':{
      tag:'Serving an LLM: batching, memory, parallelism.',
      body:'One model on one GPU is easy. The hard part is many requests at once: paged KV blocks, continuous batching, preemption, prefix reuse, tensor and pipeline parallelism, speculative decoding. Here you build the mechanisms a serving engine is made of.',
      you:['implement a paged KV allocator with copy-on-write','simulate a scheduler and read its throughput/latency tradeoff','size memory and traffic for a parallelism plan before deploying'],
      how:'graded in python: deterministic traces, reference computed by the grader'},
    'rw-applied-quantization':{
      tag:'Making weights smaller without breaking them.',
      body:'Scales, zero points, group sizes, outliers. RTN, GPTQ, AWQ, SmoothQuant, fp8 and int4 formats — reimplemented so the error budget is something you compute rather than hope for.',
      you:['implement symmetric/asymmetric quant-dequant round trips','derive calibration thresholds (min-max, percentile, entropy)','predict which layers will break and why'],
      how:'graded in python: error metrics against a full-precision oracle'},
    'rw-attention-and-kv':{
      tag:'Attention at production scale.',
      body:'FlashAttention-style tiling, online softmax, causal masking, sliding windows, KV quantization and cache reuse — the techniques that decide whether long context is affordable.',
      you:['implement a tiled attention step with running max and denominator','compute HBM traffic saved by tiling before writing a kernel','reuse a KV cache and prove the result is unchanged'],
      how:'graded in python against a dense-attention oracle'},
    'rw-compilation-and-export':{
      tag:'From a model object to a deployable artifact.',
      body:'Graph capture, operator semantics, fusion boundaries, shape specialisation and the export formats (ONNX, TensorRT engines, CoreML, GGUF). Compilers help only if you know what they may and may not change.',
      you:['decide fusion boundaries from traffic and recompute cost','reproduce operator semantics an exporter must preserve','read a graph and find the specialisation that broke it'],
      how:'graded in python: exact structural or numeric match against the reference'},
    'rw-batching-and-serving':{
      tag:'Throughput, latency and the queue between them.',
      body:'Continuous batching, chunked prefill, admission control, SLO-aware goodput. The interesting work is scheduling policy, and it is measurable without a cluster.',
      you:['simulate arrivals against slots and reproduce completion order','separate prefill from decode and report each honestly','pick a batch policy that meets a p95 target'],
      how:'graded in python: discrete-event simulation with a deterministic trace'},
    'rw-memory-and-offload':{
      tag:'Fitting a model into memory you do not have.',
      body:'Activation checkpointing, ZeRO stages, offload to host and disk, paging and residency planning. Memory is the binding constraint far more often than compute.',
      you:['compute per-layer activation and optimizer-state footprints','choose a ZeRO stage from a budget, not from a blog post','model the bandwidth cost of an offload decision'],
      how:'graded in python: formulas checked against a simulated allocator'},
    'rw-sparsity-pruning-distillation':{
      tag:'Removing capacity you were not using.',
      body:'Magnitude and structured pruning, 2:4 semi-structured sparsity, distillation objectives, and the recipes that combine them with quantization without compounding the damage.',
      you:['implement pruning masks that respect a hardware pattern','write a distillation loss and see what it actually transfers','order a compression pipeline so errors do not multiply'],
      how:'graded in python against a dense reference and a sparsity-pattern check'},
  };
  function areaInfo(k){return AREA_INFO[k]||null;}

  const LGN={py:'PY',cpp:'C++',cuda:'CUDA'};

  function renderMap(d){
    mapData=d;
    if(!foldedOnce){ d.tiers.forEach(T=>collapsed.add(T.key)); foldedOnce=true; persistFolds(); }
    $('prog').innerHTML=`<b>${d.totals.solved}</b>/${d.totals.built} · ${d.totals.planned} ${t('planned')}`;
    $('hsub').innerHTML=`${d.tiers.length} · <b>${d.totals.built}</b> ${t('available')} · ${d.totals.planned} ${t('planned')}`;
    let h='';
    d.tiers.forEach((T,ti)=>{
      const all=T.tracks.reduce((a,x)=>a.concat(x.tasks),[]);
      const solved=all.filter(x=>x.solved).length, built=all.length;
      const pct=built?Math.round(100*solved/built):0;
      const key='ti'+ti, info=areaInfo(T.key||'');
      const cls=[built?'':'locked', collapsed.has(key)?'collapsed':'', aboutOpen.has(key)?'about-on':''].join(' ');
      const mix={}; all.forEach(x=>{const k=x.native||'py'; mix[k]=(mix[k]||0)+1;});
      const langs=Object.keys(mix).sort((a,b)=>mix[b]-mix[a]).filter(k=>k!=='py'||Object.keys(mix).length===1)
        .map(k=>`<span class="lg ${k}">${LGN[k]||k} ${mix[k]}</span>`).join('');

      h+=`<section class="tier ${cls}" data-k="${key}">
        <button class="tier-h" data-tg="${key}" aria-expanded="${!collapsed.has(key)}">
          <span class="tw">${CHEV}</span>
          <span class="tring" style="--p:${pct}"></span>
          <span class="t-main"><span class="tier-nm">${esc(T.name)}</span>${
            info?`<span class="tier-tag">${esc(info.tag)}</span>`:''}</span>
          <span class="t-meta">${langs}<span class="tier-f">${solved}/${built}</span>${
            info?`<span class="info" role="button" tabindex="0" data-about="${key}"
                    aria-expanded="${aboutOpen.has(key)}"
                    aria-label="About this block">?</span>`:''}</span>
        </button>`;
      if(info){
        h+=`<div class="about"><p>${esc(info.body)}</p>
          <div class="lbl">After this block you can</div>
          <ul>${info.you.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
          <div class="how">${esc(info.how)}</div></div>`;
      }
      h+=`<div class="tier-b"><div class="nodes">`;
      T.tracks.forEach(tr=>{
        const b=tr.tasks.length, sv=tr.tasks.filter(x=>x.solved).length;
        const act=b>0, done=act&&sv===b, p=act?Math.round(100*sv/b):0;
        h+=`<div class="node ${act?'active':'locked'} ${done?'done':''}">
          <div class="n-top"><span class="n-nm">${esc(tr.name)}</span>
            <span class="n-fr">${act?sv+'/'+b:''}</span></div>`;
        if(act){
          h+=`<div class="bar"><span class="f" style="width:${p}%"></span></div><div class="chips">`+
            tr.tasks.map(x=>{
              const n=x.native||'py';
              return `<button class="chip ${x.solved?'solved':''} ${n}" data-open="${esc(x.id)}"
                        title="${esc(x.title||x.id)}">${esc(shortId(x.id))}
                        <span class="d">d${x.difficulty??'?'}</span>
                        <span class="lang">${LGN[n].toLowerCase()}</span></button>`;
            }).join('')+`</div>`;
        } else h+=`<div class="plan">${tr.planned} ${t('planned')}</div>`;
        h+=`</div>`;
      });
      h+=`</div></div></section>`;
    });
    $('map').innerHTML=h;
  }

  /* Chips carry the id, and every id repeats its track prefix. Drop it: the
     card above already says which track this is. */
  function shortId(id){
    const i=id.indexOf('-');
    return i>0 ? id.slice(i+1) : id;
  }

  function goHome(){$('app').className='app is-home'; curId=null;}
  function goWork(){$('app').className='app is-work';}

  /* ---------- markdown ---------- */
  function inl(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
  /* A small markdown renderer. It only has to cover what the statements
     actually use — measured across the bank: headings, bullets, ORDERED lists
     (458 statements use them), tables, fenced code, indented continuation
     lines, and horizontal rules. */
  const RE_FENCE=/^\s*```/, RE_HEAD=/^(#{1,6})\s+(.*)/, RE_UL=/^(\s*)[-*+]\s+(.*)/,
        RE_OL=/^(\s*)(\d+)[.)]\s+(.*)/, RE_QUOTE=/^\s*>\s?/, RE_HR=/^\s*(---+|\*\*\*+)\s*$/,
        RE_ROW=/^\s*\|.*\|/, RE_SEP=/^\s*\|[\s:|-]+\|\s*$/;

  function listBlock(L,i,ordered){
    // Collect one list. A line that is indented but is not a new item belongs to
    // the previous item — that is how a statement continues a bullet on the next
    // line, and joining it into the paragraph instead used to break the list.
    const items=[]; const RE=ordered?RE_OL:RE_UL;
    let start=null;
    while(i<L.length){
      const m=L[i].match(RE);
      if(m){ items.push([ordered?m[3]:m[2]]); if(start===null)start=(m[1]||'').length; i++; continue; }
      if(items.length && L[i].trim()!=='' && /^\s{2,}/.test(L[i]) && !RE_FENCE.test(L[i])){
        items[items.length-1].push(L[i].trim()); i++; continue;
      }
      break;
    }
    const tag=ordered?'ol':'ul';
    return [`<${tag}>${items.map(p=>`<li>${inl(p.join(' '))}</li>`).join('')}</${tag}>`, i];
  }

  /* A code span that IS the whole item/paragraph, or is simply long, reads as a
     line of code. `inl` cannot know that — it works on fragments — so it is
     decided here, where the whole item is visible. */
  function codeBlocks(html){
    return html
      .replace(/<li><code>([^<]{40,})<\/code><\/li>/g, '<li><code class="block">$1</code></li>')
      .replace(/<p><code>([^<]{40,})<\/code><\/p>/g,  '<p><code class="block">$1</code></p>');
  }

  function md(src){
    const L=(src||'').split('\n'); let h='', i=0;
    while(i<L.length){
      const ln=L[i];
      if(RE_FENCE.test(ln)){
        const lang=(ln.trim().slice(3)||'').trim(); const b=[]; i++;
        while(i<L.length&&!RE_FENCE.test(L[i])){b.push(esc(L[i]));i++;}
        i++; h+=`<pre${lang?` data-lang="${esc(lang)}"`:''}><code>${b.join('\n')}</code></pre>`; continue;
      }
      let m;
      if((m=ln.match(RE_HEAD))){h+=`<h${Math.min(m[1].length,4)}>${inl(m[2])}</h${Math.min(m[1].length,4)}>`;i++;continue;}
      if(RE_HR.test(ln)){h+='<hr>';i++;continue;}
      if(RE_QUOTE.test(ln)){const b=[];while(i<L.length&&RE_QUOTE.test(L[i])){b.push(L[i].replace(RE_QUOTE,''));i++;}h+=`<blockquote>${inl(b.join(' '))}</blockquote>`;continue;}
      if(RE_ROW.test(ln)&&i+1<L.length&&RE_SEP.test(L[i+1])){
        const row=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
        const hd=row(ln); i+=2; let bd='';
        while(i<L.length&&RE_ROW.test(L[i])){bd+='<tr>'+row(L[i]).map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>';i++;}
        h+=`<table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${bd}</tbody></table>`;continue;
      }
      if(RE_OL.test(ln)){const r=listBlock(L,i,true); h+=r[0]; i=r[1]; continue;}
      if(RE_UL.test(ln)){const r=listBlock(L,i,false); h+=r[0]; i=r[1]; continue;}
      if(ln.trim()===''){i++;continue;}
      const b=[];
      while(i<L.length&&L[i].trim()!==''&&!RE_FENCE.test(L[i])&&!RE_HEAD.test(L[i])&&
            !RE_QUOTE.test(L[i])&&!RE_UL.test(L[i])&&!RE_OL.test(L[i])&&!RE_ROW.test(L[i])&&!RE_HR.test(L[i])){
        b.push(L[i]); i++;
      }
      if(b.length===0){ if(i<L.length)b.push(L[i]); i++; }
      h+=`<p>${inl(b.join(' '))}</p>`;
    }
    return codeBlocks(h);
  }

  /* ---------- editor ---------- */
  const ta=$('ta'),hl=$('hl'),gutter=$('gutter'),aline=$('aline'),cwrap=$('cwrap');
  /* Language-aware highlighting. The bank has three real languages: python,
     real C++ (compiled by clang++) and real CUDA-C (run on the software GPU).
     Showing a .cu file with python keywords was the old lie; pick by extension. */
  const LEX={
    py:/(#.*$)|("""[\s\S]*?"""|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_][\w.]*)|(\b\d[\w.]*\b)|(\b(?:def|class|return|import|from|as|if|elif|else|for|while|in|and|or|not|is|with|assert|raise|None|True|False|lambda|yield|try|except|finally|break|continue|global|nonlocal|pass|del|async|await)\b)/gm,
    cpp:/(\/\/.*$|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(^\s*#\s*\w+)|(\b(?:0[xX][0-9a-fA-F]+|\d[\w.]*)\b)|(\b(?:auto|bool|break|case|catch|char|class|const|constexpr|continue|decltype|default|delete|do|double|else|enum|explicit|export|extern|false|float|for|friend|goto|if|inline|int|long|mutable|namespace|new|noexcept|nullptr|operator|override|private|protected|public|return|short|signed|sizeof|static|static_cast|struct|switch|template|this|throw|true|try|typedef|typename|union|unsigned|using|virtual|void|volatile|while|std|size_t|uint32_t|int64_t)\b)/gm,
    cu:/(\/\/.*$|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b(?:__global__|__device__|__shared__|__host__|__restrict__|__syncthreads|__shfl_up_sync|__shfl_down_sync|__shfl_xor_sync|threadIdx|blockIdx|blockDim|gridDim)\b)|(\b(?:0[xX][0-9a-fA-F]+|\d[\w.]*)\b)|(\b(?:bool|break|case|char|const|continue|default|do|double|else|extern|false|float|for|if|inline|int|long|return|short|signed|sizeof|static|struct|switch|true|unsigned|void|while|min|max|fminf|fmaxf|sqrtf|expf|logf|fabsf|floorf|ceilf|powf)\b)/gm,
  };
  const EXT_LANG={py:'py',cpp:'cpp',hpp:'cpp',cc:'cpp',cu:'cu',cuh:'cu'};
  let curFile='solve.py', curLang='py';
  function langOf(f){return EXT_LANG[(f||'').split('.').pop()]||'py';}
  let MASTER=LEX.py;
  function paint(){
    const code=ta.value;
    hl.innerHTML=esc(code).replace(MASTER,(m,com,str,dec,num,kw)=>{
      if(com)return '<span class="tk-com'+(/TODO|NotImplementedError|your code here|BUG/.test(com)?' tk-todo':'')+'">'+esc(com)+'</span>';
      if(str)return '<span class="tk-str">'+esc(str)+'</span>';
      if(dec)return '<span class="tk-dec">'+esc(dec)+'</span>';
      if(num)return '<span class="tk-num">'+esc(num)+'</span>';
      if(kw)return '<span class="tk-kw">'+kw+'</span>';
      return m;})+'\n';
    const n=code.split('\n').length,cur=code.slice(0,ta.selectionStart).split('\n').length;let g='';
    for(let i=1;i<=n;i++)g+='<span class="ln'+(i===cur?' cur':'')+'">'+i+'</span>';
    gutter.innerHTML=g; aline.style.top=(12+(cur-1)*20-cwrap.scrollTop)+'px'; aline.style.left=cwrap.scrollLeft+'px';
  }
  ta.addEventListener('input',()=>{paint();});
  ta.addEventListener('keyup',paint); ta.addEventListener('click',paint);
  ta.addEventListener('scroll',()=>{hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gutter.scrollTop=ta.scrollTop;cwrap.scrollTop=ta.scrollTop;cwrap.scrollLeft=ta.scrollLeft;});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.slice(0,s)+'    '+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+4;paint();}
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();doGrade();}
  });

  /* ---------- open task (-> work mode) ---------- */
  /* Non-finite metrics arrive as the strings "Infinity" / "-Infinity" / "NaN",
     because bare Infinity is not valid JSON and JSON.parse would reject the whole
     verdict. A failing grader very often returns inf, so this is the common path,
     not an edge case. */
  function num(v){
    if(typeof v==='number')return v;
    if(v==='Infinity')return Infinity;
    if(v==='-Infinity')return -Infinity;
    if(v==='NaN')return NaN;
    return v;
  }
  function fmt(v){
    v=num(v);
    if(v==null||(typeof v==='number'&&isNaN(v)))return '—';
    if(v===Infinity)return '∞'; if(v===-Infinity)return '−∞';
    if(typeof v!=='number')return String(v);
    const a=Math.abs(v);
    if(a!==0&&(a<1e-3||a>=1e5))return v.toExponential(3);
    return String(Math.round(v*10000)/10000);
  }
  function setVerdict(state,label,sub){const v=$('verdict');v.className='verdict'+(state?' '+state:'');$('vbadge').textContent={pass:'✓',fail:'✗',measuring:'◌',error:'!'}[state]||'·';$('vlabel').textContent=label;if(sub!==undefined)$('vsub').innerHTML=sub;$('instSt').textContent=state||'awaiting';}
  let curTask=null, curTags=[], curMd='';
  function renderBrief(){
    if(!curTask)return;
    const t2=curTask;
    $('brief').innerHTML=`<div class="b-id">${esc(t2.id)}</div><div class="b-title">${esc(t2.title)}</div>`
      +`<div class="b-tags">${curTags.map(x=>`<span class="b-tag">${esc(x)}</span>`).join('')}</div>`
      +`<div class="md">${md(curMd)}</div>`;
    try{if(window.renderMathInElement)renderMathInElement($('brief'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
  }
  function openTask(m){
    curId=m.task.id;
    const t2=m.task,tags=[];tags.push({cpp:'C++',cuda:'CUDA'}[t2.native]||'Python');if(t2.difficulty!=null)tags.push('d'+t2.difficulty);if(t2.genre)tags.push(t2.genre);if(t2.platform)tags.push(t2.platform);if(t2.track)tags.push(t2.track);
    curTask=t2; curTags=tags; curMd=m.md||'';
    renderBrief();
    try{if(window.renderMathInElement)renderMathInElement($('brief'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}
    $('crumb').innerHTML=`<b>${esc(t2.track||'')}</b> › ${esc(t2.id)}`;
    curFile=m.file||'solve.py'; curLang=langOf(curFile); MASTER=LEX[curLang];
    $('fname').textContent=curFile; $('ficon').textContent={py:'py',cpp:'C++',cu:'CUDA'}[curLang];
    ta.value=m.code||''; paint();
    setVerdict('',t('awaiting'),t('vsub'));
    $('metrics').innerHTML=(t2.gates||[]).map(g=>`<div class="metric"><div class="m-top"><div class="m-name">${g.metric}<span class="kind">gate</span></div><div class="m-v">idle</div></div><div class="m-val">—</div><div class="m-gate">gate <span class="thr">${g.op} ${fmt(g.threshold)}</span></div></div>`).join('');
    $('cons').textContent=t('consIdle');
    $('gradeBtn').removeAttribute('disabled');
    goWork(); ta.focus();
  }
  function renderResult(d){
    const names=new Set((d.gates||[]).map(g=>g.metric));
    let h=(d.gates||[]).map(g=>`<div class="metric ${g.ok?'green':'red'}"><div class="m-top"><div class="m-name">${g.metric}<span class="kind">gate</span></div><div class="m-v">${g.ok?'pass':'fail'}</div></div><div class="m-val">${fmt(g.value)}</div><div class="m-gate">gate <span class="thr">${g.op} ${fmt(g.threshold)}</span></div></div>`).join('');
    Object.keys(d.metrics||{}).forEach(k=>{if(names.has(k))return;h+=`<div class="metric"><div class="m-top"><div class="m-name">${k}<span class="kind">info</span></div></div><div class="m-val" style="color:var(--steel)">${fmt(d.metrics[k])}</div></div>`;});
    $('metrics').innerHTML=h;
    const n=(d.gates||[]).filter(g=>g.ok).length,tot=(d.gates||[]).length;
    if(d.passed)setVerdict('pass',t('pass'),`<span class="ok">${n}/${tot} ${t('gatesGreen')}</span>`); else setVerdict('fail',t('fail'),`${n}/${tot} gates`);
    let log=`> mlsys grade ${curId}\n`;(d.gates||[]).forEach(g=>log+=`  ${g.ok?'✓':'✗'} ${g.metric} = ${fmt(g.value)}   gate ${g.op} ${fmt(g.threshold)}\n`);log+=`  ${d.verdict}`;
    $('cons').innerHTML=esc(log).replace(/✓/g,'<span class="ok">✓</span>').replace(/✗/g,'<span class="bad">✗</span>');
  }
  function doGrade(){if(busy||!curId)return;busy=true;$('gradeBtn').classList.add('running');$('gradeBtn').setAttribute('disabled','');setVerdict('measuring',t('measuring'),t('running'));$('cons').textContent='> spawning grader …';vscode.postMessage({type:'grade',id:curId,file:curFile,code:ta.value});}
  $('gradeBtn').addEventListener('click',doGrade);

  /* ---------- resizers ---------- */
  function initResizers(){
    const st=vscode.getState()||{}; if(st.lw)document.documentElement.style.setProperty('--lw',st.lw); if(st.rw)document.documentElement.style.setProperty('--rw',st.rw);
    function drag(handle,side){
      handle.addEventListener('mousedown',e=>{e.preventDefault();handle.classList.add('drag');
        const work=$('work'),rect=work.getBoundingClientRect();
        function mv(ev){
          if(side==='L'){let w=Math.min(560,Math.max(180,ev.clientX-rect.left));document.documentElement.style.setProperty('--lw',w+'px');}
          else{let w=Math.min(620,Math.max(220,rect.right-ev.clientX));document.documentElement.style.setProperty('--rw',w+'px');}
        }
        function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);handle.classList.remove('drag');
          const s=vscode.getState()||{};s.lw=getComputedStyle(document.documentElement).getPropertyValue('--lw').trim();s.rw=getComputedStyle(document.documentElement).getPropertyValue('--rw').trim();vscode.setState(s);}
        document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
      });
    }
    drag($('rzL'),'L'); drag($('rzR'),'R');
  }

  /* ---------- nav / messages ---------- */
  document.addEventListener('click',e=>{
    const ab=e.target.closest('[data-about]');
    if(ab){e.stopPropagation();const k=ab.getAttribute('data-about');
      const on=aboutOpen.has(k); on?aboutOpen.delete(k):aboutOpen.add(k);
      const nd=document.querySelector(`[data-k="${k}"]`);
      if(nd)nd.classList.toggle('about-on',!on);
      ab.setAttribute('aria-expanded',String(!on));return;}
    const o=e.target.closest('[data-open]');
    if(o){vscode.postMessage({type:'open',id:o.getAttribute('data-open')});return;}
    const tg=e.target.closest('[data-tg]');
    if(tg){const k=tg.getAttribute('data-tg');
      const on=collapsed.has(k); on?collapsed.delete(k):collapsed.add(k); persistFolds();
      const nd=document.querySelector(`[data-k="${k}"]`);
      if(nd)nd.classList.toggle('collapsed',!on);
      tg.setAttribute('aria-expanded',String(on));}
  });
  let rzT=null;
  window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(mapData)renderMap(mapData);},120);});
  $('back').addEventListener('click',goHome);
  window.addEventListener('message',e=>{
    const m=e.data||{};
    if(m.type==='map'){renderMap(m.payload);goHome();}
    else if(m.type==='mapdata'){mapData=m.payload;if($('app').classList.contains('is-home'))renderMap(m.payload);}
    else if(m.type==='task'){openTask(m);}
    else if(m.type==='measuring'){setVerdict('measuring',t('measuring'),t('running'));}
    else if(m.type==='result'){busy=false;$('gradeBtn').classList.remove('running');$('gradeBtn').removeAttribute('disabled');renderResult(m.data);}
    else if(m.type==='error'){busy=false;$('gradeBtn').classList.remove('running');$('gradeBtn').removeAttribute('disabled');setVerdict('error',t('error'),'grader failed');$('cons').textContent=(m.message||'').slice(0,2000);}
  });

  initLang(); initResizers();
  vscode.postMessage({type:'ready'});
  setTimeout(()=>{ try{
    const a=document.getElementById('app'), cs=getComputedStyle(a);
    vscode.postMessage({type:'diag', msg:`appDisp=${cs.display} appOff=${a.offsetWidth}x${a.offsetHeight} mode=${a.className} win=${window.innerWidth}x${window.innerHeight}`});
  }catch(e){ vscode.postMessage({type:'diag', msg:'diag-error '+e.message}); } }, 300);
</script>
</body>
</html>
