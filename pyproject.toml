[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlsys-lab"
version = "0.2.0"
description = "Auto-graded exercises in low-level ML systems: mostly Python, with real C++ via clang++ and real CUDA-C on a software GPU"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Oleksandr Savkov" }]
keywords = ["cuda", "gpu", "performance", "quantization", "llm-inference",
            "systems-programming", "exercises", "cpp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Education",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

# A few tasks' oracles need a package the bank as a whole does not. Declared per task
# in meta.json as `requires_pkgs`; `mlsys grade` names what is missing rather than
# raising from inside someone else's oracle. torch is its own extra because it is
# ~800 MB and exactly one task uses it.
[project.optional-dependencies]
extras = ["scipy>=1.11", "ml-dtypes>=0.4", "mpmath>=1.3"]
torch = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/mikamika06/mlsys-lab"
Issues = "https://github.com/mikamika06/mlsys-lab/issues"

[project.scripts]
mlsys = "mlsys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlsys"]
# `solve.*` is the learner's scratch file. It is gitignored, but a build copies the
# working tree and not the index, so a developer who had run the verifier would ship
# 1,596 stale scratch files — and, if they had just solved something, the answer.
# Excluded here so the state of the working tree cannot affect what gets published.
exclude = ["**/solve.py", "**/solve.cpp", "**/solve.cu", "**/__pycache__", "**/*.pyc"]

# The bank lives at the repo root for development but has to ship inside the
# package, because a wheel installs into site-packages and nothing outside the
# package directory survives. mlsys/bank.py looks for it there last.
#
# It is staged by hatch_build.py rather than force-included directly: force-include
# ignores the `exclude` patterns above, so a direct include ships the learner's
# gitignored solve.* scratch files. See that file for the measurement.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/mlsys", "tasks", "projects", "tools", "concepts", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]
exclude = ["**/solve.py", "**/solve.cpp", "**/solve.cu", "**/__pycache__", "**/*.pyc"]
